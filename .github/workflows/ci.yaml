name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
           push: true
           tags: henria/ci_pipline_1:${{ github.sha }}
           
      - name: Clone GitOps Repo
        run: |
          git clone https://x-access-token:${{ secrets.GIT_TOKEN }}@github.com/henria21/gitops-application.git
          cd gitops-application

      - name: Update Helm values file
        run: |
          cd gitops-application

          if [ "${{ github.ref_name }}" = "dev" ]; then
            VALUES_FILE="charts/myapp/values-dev.yaml"
          else
            VALUES_FILE="charts/myapp/values-prod.yaml"
          fi

          sed -i "s/tag:.*/tag: \"${{ steps.vars.outputs.SHA_TAG }}\"/" $VALUES_FILE

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add $VALUES_FILE
          git commit -m "Update image tag to ${{ steps.vars.outputs.SHA_TAG }}"
          git push
